<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pedidos Parrilla</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f4;font-family:Arial,sans-serif;color:#222}
header{background:#171717;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:22px}header small{color:#bbb}
main{padding:12px;max-width:560px;margin:auto}.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0001}
label{font-size:11px;font-weight:bold;color:#777;display:block;margin-bottom:5px}
.grid{display:grid;grid-template-columns:1fr 85px;gap:8px}select,input{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;font-size:16px;background:#fff}
button{border:0;border-radius:10px;padding:12px;font-weight:bold;font-size:15px}.add{width:100%;margin-top:9px;background:#f57c00;color:white}
.head{display:flex;justify-content:space-between;align-items:center}.head h2{font-size:17px;margin:0}.muted{color:#888;font-size:12px}
.item{display:grid;grid-template-columns:42px 1fr 85px 32px;gap:6px;align-items:center;border-bottom:1px solid #eee;padding:11px 0}.item:last-child{border:0}
.qty{text-align:center;font-weight:bold}.name{font-weight:bold;font-size:14px}.sub{text-align:right;font-size:13px}
.del{padding:6px;background:#fee;color:#c62828}.total{display:flex;justify-content:space-between;border-top:2px solid #eee;padding-top:12px;margin-top:7px;font-size:18px;font-weight:bold}.total b{font-size:25px;color:#f57c00}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dark{background:#171717;color:#fff}.gray{background:#eee}
.product{display:grid;grid-template-columns:1fr 85px 34px;gap:6px;margin:7px 0}.product button{padding:7px;background:#eee}
.empty{text-align:center;color:#aaa;padding:20px}.tables{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.tableBtn{white-space:nowrap;padding:9px 12px;border-radius:9px;background:#eee;border:0;font-weight:bold}.tableBtn.active{background:#171717;color:#fff}.tableBtn small{display:block;font-weight:normal;opacity:.7}.editrow{display:grid;grid-template-columns:1fr 85px 34px;gap:6px;margin:7px 0}
</style>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#171717">
<link rel="apple-touch-icon" href="./icon-192.png">
</head>
<body>
<header><h1>🍖 Pedidos Parrilla</h1><small>Control rápido de pedidos</small></header>
<main>
<section class="card">
<div class="grid">
<div><label>PRODUCTO</label><select id="sel"></select></div>
<div><label>CANTIDAD</label><input id="qty" type="number" min="1" value="1"></div>
</div>
<button class="add" onclick="add()">+ AGREGAR</button>
</section>

<section class="card">
<div class="head"><h2>Pedidos / Mesas</h2><button class="gray" onclick="newTable()">+ Nueva mesa</button></div><div id="tables" class="tables"></div><div class="actions" style="margin-top:6px"><button class="gray" onclick="renameTable()">✏️ Renombrar</button><button class="gray" onclick="deleteTable()">🗑️ Eliminar mesa</button></div><div class="head" style="margin-top:12px"><h2 id="currentTitle">Pedido actual</h2><span class="muted" id="count">0 productos</span></div>
<div id="list"></div>
<div class="total"><span>TOTAL</span><b>S/ <span id="total">0.00</span></b></div>
</section>

<section class="card">
<label>REFERENCIA / CLIENTE</label>
<input id="ref" placeholder="Ej. Mesa 2 / Juan">
<div class="actions" style="margin-top:9px">
<button class="gray" onclick="clearOrder()">Limpiar</button>
<button class="dark" onclick="copy()">Copiar pedido</button>
</div>
</section>

<section class="card">
<div class="head"><h2>Productos y precios</h2></div>
<div id="products"></div>
<button class="add" onclick="newProduct()">+ AGREGAR PRODUCTO</button>
</section>
</main>

<script>
/*
  Pedidos Parrilla - versión corregida
  - Guarda cada cambio de mesa/pedido inmediatamente.
  - Evita perder mesas al recargar/cerrar la página.
  - Corrige el error de productsDiv no definido.
  - Permite editar nombre y precio de productos.
  - Permite eliminar productos del catálogo sin borrar productos
    que ya estén dentro de pedidos existentes.
  - Guarda una copia de respaldo local del estado.
*/

const VERSION = '3';
const KEYS = {
  products: 'pp_products',
  tables: 'pp_tables',
  current: 'pp_current_table',
  backup: 'pp_backup_v3',
  version: 'pp_clean_version'
};

let products = readJSON(KEYS.products, []);
let tables = readJSON(KEYS.tables, []);
let currentTable = Number(localStorage.getItem(KEYS.current) || 0);
let order = [];

const money = n => Number(n || 0).toFixed(2);
const sel = document.getElementById('sel');
const qty = document.getElementById('qty');
const list = document.getElementById('list');
const total = document.getElementById('total');
const count = document.getElementById('count');
const ref = document.getElementById('ref');
const tablesDiv = document.getElementById('tables');
const currentTitle = document.getElementById('currentTitle');
const productsDiv = document.getElementById('products');

const esc = s => String(s ?? '')
  .replace(/&/g,'&amp;')
  .replace(/"/g,'&quot;')
  .replace(/</g,'&lt;')
  .replace(/>/g,'&gt;');

function readJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return fallback;
    const value = JSON.parse(raw);
    return value ?? fallback;
  } catch (e) {
    return fallback;
  }
}

function normalizeData() {
  if (!Array.isArray(products)) products = [];
  products = products
    .filter(p => p && typeof p === 'object' && String(p.name || '').trim())
    .map(p => ({name: String(p.name).trim(), price: Math.max(0, Number(p.price) || 0)}));

  if (!Array.isArray(tables)) tables = [];
  tables = tables
    .filter(t => t && typeof t === 'object')
    .map((t, i) => ({
      name: String(t.name || `Mesa ${i + 1}`).trim() || `Mesa ${i + 1}`,
      ref: String(t.ref || ''),
      order: Array.isArray(t.order) ? t.order.filter(x => x && typeof x === 'object').map(x => ({
        name: String(x.name || ''),
        price: Math.max(0, Number(x.price) || 0),
        qty: Math.max(1, Number(x.qty) || 1)
      })) : []
    }));

  if (!tables.length) {
    tables = [{name:'Mesa 1', ref:'', order:[]}];
  }

  if (!Number.isInteger(currentTable) || currentTable < 0 || currentTable >= tables.length) {
    currentTable = 0;
  }
}

function persistAll() {
  normalizeData();

  // Respaldo del estado anterior antes de escribir el nuevo.
  try {
    const old = {
      products: readJSON(KEYS.products, products),
      tables: readJSON(KEYS.tables, tables),
      currentTable: Number(localStorage.getItem(KEYS.current) || currentTable),
      savedAt: new Date().toISOString()
    };
    localStorage.setItem(KEYS.backup, JSON.stringify(old));
  } catch (e) {}

  try {
    localStorage.setItem(KEYS.products, JSON.stringify(products));
    localStorage.setItem(KEYS.tables, JSON.stringify(tables));
    localStorage.setItem(KEYS.current, String(currentTable));
    localStorage.setItem(KEYS.version, VERSION);
  } catch (e) {
    alert('No se pudo guardar el pedido. Revisa que el navegador no esté en modo privado o sin espacio.');
  }
}

function saveOrder() {
  normalizeData();
  if (!tables.length) return;
  tables[currentTable].order = order.map(x => ({
    name: String(x.name || ''),
    price: Number(x.price) || 0,
    qty: Math.max(1, Number(x.qty) || 1)
  }));
  tables[currentTable].ref = ref.value || '';
  persistAll();
}

function renderProducts(selectedIndex = null) {
  sel.innerHTML = products.length
    ? products.map((p,i) =>
        `<option value="${i}">${esc(p.name)} — S/ ${money(p.price)}</option>`
      ).join('')
    : '<option value="">No hay productos</option>';

  productsDiv.innerHTML = products.length
    ? products.map((p,i) => `
      <div class="editrow">
        <input value="${esc(p.name)}" aria-label="Nombre del producto"
               onchange="edit(${i},'name',this.value)">
        <input type="number" min="0" step=".10" value="${money(p.price)}"
               aria-label="Precio del producto"
               onchange="edit(${i},'price',this.value)">
        <button class="del" onclick="removeP(${i})" title="Eliminar producto">×</button>
      </div>
    `).join('')
    : '<div class="empty">Agrega tu primer producto.</div>';

  if (selectedIndex !== null && products[selectedIndex]) {
    sel.value = String(selectedIndex);
  }
}

function renderTables() {
  normalizeData();
  tablesDiv.innerHTML = tables.map((t,i) =>
    `<button class="tableBtn ${i===currentTable?'active':''}" onclick="selectTable(${i})">
      ${esc(t.name)}<small>${t.order.length} productos</small>
    </button>`
  ).join('');
  currentTitle.textContent = 'Pedido — ' + tables[currentTable].name;
}

function renderOrder() {
  list.innerHTML = order.length
    ? order.map((x,i) => `
      <div class="item">
        <div class="qty">${x.qty}×</div>
        <div class="name">${esc(x.name)}</div>
        <div class="sub">S/ ${money(x.qty*x.price)}</div>
        <button class="del" onclick="del(${i})">×</button>
      </div>
    `).join('')
    : '<div class="empty">No hay productos todavía.</div>';

  const t = order.reduce((s,x) => s + (Number(x.qty)||0) * (Number(x.price)||0), 0);
  total.textContent = money(t);
  count.textContent = order.reduce((s,x) => s + (Number(x.qty)||0), 0) + ' productos';
}

function newTable() {
  const suggested = 'Mesa ' + (tables.length + 1);
  const name = prompt('Nombre de la mesa o pedido', suggested);
  if (!name || !name.trim()) return;

  // Primero aseguramos que la mesa actual quede guardada.
  saveOrder();

  tables.push({name:name.trim(), ref:'', order:[]});
  currentTable = tables.length - 1;
  order = [];
  ref.value = '';

  persistAll();
  renderTables();
  renderOrder();
}

function selectTable(i) {
  if (i < 0 || i >= tables.length) return;

  saveOrder();
  currentTable = i;
  order = Array.isArray(tables[i].order) ? tables[i].order : [];
  ref.value = tables[i].ref || '';

  persistAll();
  renderTables();
  renderOrder();
}

function renameTable() {
  if (!tables.length) return;
  const name = prompt('Nombre de la mesa', tables[currentTable].name);
  if (!name || !name.trim()) return;

  tables[currentTable].name = name.trim();
  persistAll();
  renderTables();
}

function deleteTable() {
  if (!tables.length) return;
  if (!confirm('¿Eliminar esta mesa y su pedido? Esta acción no se puede deshacer.')) return;

  tables.splice(currentTable, 1);

  if (!tables.length) {
    tables.push({name:'Mesa 1', ref:'', order:[]});
  }

  currentTable = Math.min(currentTable, tables.length - 1);
  order = tables[currentTable].order || [];
  ref.value = tables[currentTable].ref || '';

  persistAll();
  renderTables();
  renderOrder();
}

function edit(i,k,v) {
  if (!products[i]) return;

  if (k === 'price') {
    const price = Number(v);
    if (!Number.isFinite(price) || price < 0) {
      alert('Ingresa un precio válido.');
      renderProducts(i);
      return;
    }
    products[i].price = price;
  } else {
    const name = String(v || '').trim();
    if (!name) {
      alert('El producto debe tener un nombre.');
      renderProducts(i);
      return;
    }
    products[i].name = name;
  }

  persistAll();
  renderProducts(i);
}

function newProduct() {
  const n = prompt('Nombre del producto');
  if (!n || !n.trim()) return;

  const raw = prompt('Precio en soles', '0');
  if (raw === null) return;

  const p = Number(raw);
  if (!Number.isFinite(p) || p < 0) {
    alert('Ingresa un precio válido.');
    return;
  }

  products.push({name:n.trim(), price:p});
  const index = products.length - 1;

  persistAll();
  renderProducts(index);
  sel.value = String(index);
}

function removeP(i) {
  if (!products[i]) return;

  const name = products[i].name;
  if (!confirm(`¿Eliminar "${name}" de la lista general de productos?`)) return;

  // Importante: NO borramos el producto de mesas existentes.
  // Los pedidos guardan nombre/precio como copia histórica.
  products.splice(i, 1);

  persistAll();
  renderProducts();
}

function add() {
  if (!products.length) {
    alert('Agrega productos primero.');
    return;
  }

  const index = Number(sel.value);
  const p = products[index];
  if (!p) return;

  const q = Math.max(1, Number(qty.value) || 1);
  const x = order.find(a => a.name === p.name && Number(a.price) === Number(p.price));

  if (x) x.qty += q;
  else order.push({name:p.name, price:Number(p.price), qty:q});

  qty.value = 1;

  // CORRECCIÓN CLAVE: guardar inmediatamente al agregar.
  saveOrder();
  renderTables();
  renderOrder();
}

function del(i) {
  if (i < 0 || i >= order.length) return;
  order.splice(i, 1);
  saveOrder();
  renderTables();
  renderOrder();
}

function clearOrder() {
  if (order.length && !confirm('¿Limpiar el pedido de esta mesa?')) return;

  order = [];
  ref.value = '';
  saveOrder();
  renderTables();
  renderOrder();
}

ref.addEventListener('input', () => {
  if (!tables.length) return;
  tables[currentTable].ref = ref.value;
  persistAll();
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') saveOrder();
});

window.addEventListener('beforeunload', () => saveOrder());

async function copy() {
  if (!order.length) return alert('No hay productos en esta mesa.');

  let t = `PEDIDO — ${tables[currentTable].name}`;
  if (ref.value.trim()) t += ` — ${ref.value.trim()}`;
  t += '\n----------------\n';

  order.forEach(x => {
    t += `${x.qty} x ${x.name} — S/ ${money(x.qty*x.price)}\n`;
  });

  t += '----------------\nTOTAL: S/ ' + total.textContent;

  try {
    await navigator.clipboard.writeText(t);
    alert('Pedido copiado.');
  } catch(e) {
    const ta = document.createElement('textarea');
    ta.value = t;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    alert('Pedido copiado.');
  }
}

// Migración segura: no elimina mesas ni productos existentes.
normalizeData();
order = tables[currentTable].order || [];
ref.value = tables[currentTable].ref || '';
persistAll();
renderProducts();
renderTables();
renderOrder();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
